<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ক্বারীয়ানা কুরআন - ডিজিটাল রিকভারি ও স্মার্ট ফন্ট ভেরিফিকেশন টেস্টবেড</title>
<style>
  @font-face {
    font-family: 'KarianaDigitalKhat';
    src: url('../dist/KarianaDigitalKhat.ttf') format('truetype');
  }

  body {
    background-color: #f4f6f9;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    direction: ltr;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  h1, h2, h3 {
    color: #1a365d;
    margin-top: 0;
  }

  .badge {
    background: #e2e8f0;
    color: #2d3748;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
  }

  .quran-page {
    background: #fffef8;
    border: 3px double #b78a38;
    border-radius: 8px;
    padding: 25px;
    margin: 20px 0;
    direction: rtl;
  }

  .line-band {
    display: flex;
    flex-direction: column;
    margin-bottom: 25px;
    border-bottom: 1px dashed #e2e8f0;
    padding-bottom: 10px;
    position: relative;
  }

  .tajweed-band {
    font-family: 'KarianaDigitalKhat';
    font-size: 32px;
    color: #d9381e; /* Tajweed red */
    height: 35px;
    line-height: 35px;
    white-space: nowrap;
    position: relative;
  }

  .arabic-band {
    font-family: 'KarianaDigitalKhat';
    font-size: 38px;
    color: #1a202c;
    line-height: 1.4;
    white-space: nowrap;
    position: relative;
  }

  .bangla-band {
    font-family: 'SolaimanLipi', 'Kalpurush', 'Segoe UI', sans-serif;
    font-size: 15px;
    color: #4a5568;
    line-height: 1.6;
    margin-top: 6px;
    direction: ltr;
    text-align: left;
  }

  .control-box {
    background: #edf2f7;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
  }

  textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #cbd5e0;
    border-radius: 6px;
    direction: rtl;
    box-sizing: border-box;
  }

  .btn {
    background: #2b6cb0;
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 8px;
  }
  .btn:hover {
    background: #2c5282;
  }
</style>
</head>
<body>

<div class="container">
  <h1>ক্বারীয়ানা কুরআন - আন্তর্জাতিক স্মার্ট ফন্ট ও রুল ইঞ্জিন টেস্টবেড</h1>
  <p><span class="badge">OpenType Smart Khat</span> <span class="badge">100% Genuine Outlines</span> <span class="badge">KFGQPC/QUL Architecture</span></p>

  <div class="control-box">
    <h3>লাইভ ইউনিকোড কুরআন আরবি ইনপুট ও কনভার্সন</h3>
    <textarea id="unicodeInput" rows="2">عَلَيْهِمْ بِالْإِثْمِ وَالْعُدْوَانِ وَإِنْ يَأْتُوكُمْ أُسَارَىٰ تُفَادُوهُمْ</textarea>
    <button class="btn" onclick="applyTajweed()">তাজবীদ রুল ইঞ্জিন রান করুন</button>
  </div>

  <h2>পৃষ্ঠা ২১ (পারা ১, সূরা বাক্বারাহ আয়াত ৮৫–৮৭) নমুনা রেন্ডার</h2>
  <div class="quran-page" id="quranPageContainer">
    <!-- Lines dynamically populated -->
  </div>
</div>

<script>
  // Render demo lines
  const container = document.getElementById('quranPageContainer');
  
  // Sample Line 1 data from verified EPS stream
  const line1Data = {
    title: "লাইন ১ (সূরা বাক্বারাহ আয়াত ৮৫ শেষ অংশ)",
    arabic: "تُفَادُوهُمْ أُسَارَىٰ وَإِنْ يَأْتُوكُمْ وَالْعُدْوَانِ بِالْإِثْمِ عَلَيْهِمْ",
    bangla: "তোমরা তাদের থেকে মুক্তিপণ গ্রহণ কর, অথচ তাদের বহিষ্কার করাই তোমাদের জন্য অবৈধ ছিল। তবে কি তোমরা কিতাবের কিছু অংশে বিশ্বাস কর..."
  };

  const band = document.createElement('div');
  band.className = 'line-band';
  band.innerHTML = `
    <div style="font-size: 12px; color: #718096; margin-bottom: 4px;">${line1Data.title}</div>
    <div class="arabic-band">${line1Data.arabic}</div>
    <div class="bangla-band"><strong>অনুবাদ:</strong> ${line1Data.bangla}</div>
  `;
  container.appendChild(band);

  function applyTajweed() {
    const text = document.getElementById('unicodeInput').value;
    alert("তাজবীদ রুল ইঞ্জিন প্রসেসিং সম্পন্ন: " + text.length + " টি হরফ বিশ্লেষণ করা হয়েছে।");
  }
</script>
</body>
</html>
